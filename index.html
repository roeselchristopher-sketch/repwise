<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Repwise">
<title>Repwise</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE: a coach's clipboard: direct, encouraging, numbers first.
   IDEA: the gym's loading bar and bumper plates; every session loads a plate onto this week's bar.
   PICTURE: the week's barbell on Today, plates in real bumper colours (red 25, blue 20, yellow 15, green 10).
   COLOUR and TYPE: chalk ground, iron-black band, plate red accent; Barlow Condensed numbers like plate stamping, Barlow text.
   LAYOUT: one phone column, bottom tab bar, cards that scroll; full-screen workout logger with a rest timer. */
:root{color-scheme:light dark;
 --bg:light-dark(#f1f0eb,#0f1012);--card:light-dark(#fff,#1a1c20);--card2:light-dark(#f7f6f1,#23262b);
 --ink:light-dark(#16181b,#efeee9);--muted:light-dark(#62666d,#9da2aa);--line:light-dark(#e3e1d9,#2c2f35);
 --red:light-dark(#e23d27,#ff5c42);--blue:light-dark(#2357d4,#6690ff);--yellow:light-dark(#d99c00,#f3c03f);--green:light-dark(#13885a,#36c47f);
 --band:#16181b;--band-ink:#f1f0eb;--band-mute:#9ba0a8;--shadow:0 1px 2px rgba(0,0,0,.05),0 6px 18px rgba(0,0,0,.05);
 --display:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;--sans:Barlow,system-ui,-apple-system,'Segoe UI',sans-serif;
 --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--sans);overflow-x:clip}
body{padding-top:var(--safe-t)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
input,select,textarea{font-size:16px;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;min-height:44px}
textarea{min-height:96px;resize:vertical}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:3px solid color-mix(in srgb,var(--red) 55%,transparent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:700;line-height:1.05;margin:0;letter-spacing:.2px;text-wrap:balance}
h1{font-size:36px}h2{font-size:24px}h3{font-size:19px}
p{margin:0}
.wrap{max-width:560px;margin:0 auto;padding:0 16px calc(96px + var(--safe-b))}
.head{padding:18px 0 14px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.eyebrow{color:var(--muted);font-size:14px;font-weight:500}
.muted{color:var(--muted)}.small{font-size:14px}.tiny{font-size:13px}
.num{font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.wrapx{flex-wrap:wrap}
.grow{flex:1}.stack>*+*{margin-top:12px}.mt{margin-top:12px}.mt2{margin-top:20px}
.card{background:var(--card);border-radius:20px;padding:16px;box-shadow:var(--shadow)}
.card+.card,.card+.sec,.sec+.card{margin-top:12px}
.sec{margin-top:22px}.sec>h2{margin-bottom:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:14px;font-weight:600;background:var(--card2);color:var(--ink)}
.btn.primary{background:var(--red);color:#fff}.btn.dark{background:var(--ink);color:var(--bg)}
.btn.block{width:100%}.btn.sm{min-height:40px;padding:0 14px;font-size:15px;border-radius:12px}
.btn.ghost{background:transparent;border:1.5px solid var(--line)}
.btn:disabled{opacity:.45}
.icon-btn{width:44px;height:44px;border-radius:12px;display:inline-grid;place-items:center;color:var(--muted)}
.icon-btn svg{width:22px;height:22px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 12px;border-radius:999px;background:var(--card2);font-size:14px;font-weight:600}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);background:var(--card2);border-radius:14px;padding:4px;gap:4px}
.seg button{min-height:42px;border-radius:10px;font-weight:600;font-size:15px;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.choice{display:block;width:100%;text-align:left;background:var(--card);border:2px solid transparent;border-radius:18px;padding:16px;box-shadow:var(--shadow)}
.choice+.choice{margin-top:10px}.choice[aria-pressed=true]{border-color:var(--red)}
.choice b{display:block;font-family:var(--display);font-size:22px;line-height:1.1}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.days button{min-height:48px;border-radius:12px;background:var(--card2);font-weight:600}
.days button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:52px;padding:6px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.toggle:last-child{border-bottom:0}
.sw{width:50px;height:30px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:background .2s}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
[aria-checked=true] .sw{background:var(--green)}[aria-checked=true] .sw::after{transform:translateX(20px)}
label.f{display:block;font-size:14px;font-weight:600;color:var(--muted);margin-bottom:6px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:var(--safe-b)}
.tabbar nav{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
.tabbar button{min-height:58px;display:grid;place-items:center;gap:2px;font-size:12px;font-weight:600;color:var(--muted);padding-top:6px}
.tabbar button svg{width:24px;height:24px}
.tabbar button[aria-current=page]{color:var(--red)}
.pill{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(70px + var(--safe-b));z-index:21;background:var(--red);color:#fff;border-radius:999px;padding:10px 18px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.25);white-space:nowrap}
/* hero band */
.band{background:var(--band);color:var(--band-ink);margin:0 -16px;padding:18px 16px 20px;border-radius:0 0 28px 28px}
.band .muted{color:var(--band-mute)}
.bar-pic{width:100%;height:auto;display:block;margin:4px 0 6px}
.band h1{font-size:40px}
.band .btn.primary{min-height:54px;font-size:17px}
.wk-strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-top:14px}
.wk-strip div{text-align:center;padding:8px 0 10px;border-radius:12px;background:rgba(255,255,255,.06);font-size:13px;font-weight:600;color:var(--band-mute)}
.wk-strip div.today{background:rgba(255,255,255,.14);color:var(--band-ink)}
.wk-strip i{display:block;width:10px;height:10px;border-radius:50%;margin:6px auto 0;border:2px solid currentColor;opacity:.7}
.wk-strip i.done{background:var(--red);border-color:var(--red);opacity:1}.wk-strip i.rest{border:0;background:currentColor;width:4px;height:4px;margin-top:9px;opacity:.5}
/* stats */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:var(--card);border-radius:16px;padding:12px;box-shadow:var(--shadow)}
.stat .num{font-size:30px;line-height:1}.stat .tiny{color:var(--muted);margin-top:4px}
.meter{height:8px;background:var(--card2);border-radius:99px;overflow:hidden}
.meter i{display:block;height:100%;border-radius:99px;background:var(--ink)}
.mrow{display:grid;grid-template-columns:76px minmax(0,1fr) auto;gap:10px;align-items:center;font-size:14px}
.mrow+.mrow{margin-top:8px}
.ring{width:112px;height:112px;flex:none}
/* plan */
.dayrow{display:grid;grid-template-columns:44px minmax(0,1fr);gap:10px;align-items:start}
.dayrow+.dayrow{margin-top:12px}
.dayrow .dname{font-family:var(--display);font-weight:700;font-size:18px;padding-top:14px;color:var(--muted)}
.dayrow.rest .dname{padding-top:2px}
.exlist{list-style:none;margin:10px 0 0;padding:0}
.exlist li button{display:flex;width:100%;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line);text-align:left}
.exlist .rx{color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.phase{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px;margin-top:10px}
.phase i{height:8px;border-radius:4px;background:var(--card2)}.phase i.on{background:var(--red)}.phase i.dl{background:var(--yellow)}
/* workout */
.wk{position:fixed;inset:0;z-index:30;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;padding-top:var(--safe-t)}
.wk-top{position:sticky;top:0;z-index:2;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.wk-top .in{max-width:560px;margin:0 auto;padding:8px 12px;display:flex;align-items:center;gap:8px}
.wk-body{max-width:560px;margin:0 auto;padding:12px 12px calc(130px + var(--safe-b))}
.ex-card{background:var(--card);border-radius:20px;padding:14px 12px 10px;box-shadow:var(--shadow)}
.ex-card+.ex-card{margin-top:12px}
.ex-card.complete{outline:2px solid color-mix(in srgb,var(--green) 60%,transparent)}
.ex-head{display:flex;align-items:flex-start;gap:4px}
.ex-head h3{flex:1;padding-top:8px;padding-left:4px}
.ex-note{font-size:14px;margin:6px 4px 8px;padding:8px 10px;border-radius:10px;background:var(--card2)}
.sets{display:grid;grid-template-columns:28px minmax(0,1fr) 76px 64px 48px;gap:6px;align-items:center}
.sets .h{font-size:12px;font-weight:600;color:var(--muted);text-align:center}
.sets .h:nth-child(2){text-align:left}
.sets .n{text-align:center;font-weight:700;color:var(--muted)}
.sets .prev{font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sets input{text-align:center;padding:8px 4px;min-height:44px;font-weight:600}
.chk{width:44px;height:44px;border-radius:12px;background:var(--card2);display:grid;place-items:center;color:var(--muted)}
.chk svg{width:22px;height:22px}
.chk[aria-pressed=true]{background:var(--green);color:#fff}
.set-done input{background:color-mix(in srgb,var(--green) 12%,var(--card));border-color:transparent}
.rest-bar{position:fixed;left:0;right:0;bottom:0;z-index:35;background:var(--ink);color:var(--bg);padding:10px 16px calc(10px + var(--safe-b))}
.rest-bar .in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:10px}
.rest-bar .num{font-size:34px;flex:1}
.rest-bar button{min-height:44px;min-width:52px;border-radius:12px;background:rgba(127,127,127,.25);color:inherit;font-weight:600}
.rest-bar .prog{position:absolute;left:0;top:0;height:3px;background:var(--red)}
.rest-bar.go{background:var(--green)}
/* sheet */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.42);display:flex;align-items:flex-end;justify-content:center;animation:fade .18s}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow-y:auto;border-radius:24px 24px 0 0;padding:8px 16px calc(20px + var(--safe-b));animation:up .22s cubic-bezier(.2,.8,.2,1)}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 10px}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
@keyframes up{from{transform:translateY(40px);opacity:.4}}@keyframes fade{from{opacity:0}}
.toast{position:fixed;left:50%;bottom:calc(84px + var(--safe-b));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:600;font-size:15px;max-width:calc(100% - 32px);box-shadow:0 10px 30px rgba(0,0,0,.25);animation:up .2s}
/* lists */
.li{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.li:first-child{border-top:0}
.li .t{flex:1}.li .t b{display:block;font-weight:600}
.meal h3{display:flex;justify-content:space-between;align-items:center}
.fig{position:relative;height:200px}.fig svg{position:absolute;inset:0;width:100%;height:100%}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center}
.cal .h{font-size:12px;color:var(--muted);font-weight:600}
.cal button{aspect-ratio:1;border-radius:10px;font-weight:600;font-size:14px;display:grid;place-items:center;position:relative;background:var(--card2)}
.cal button.out{background:transparent;color:var(--muted);opacity:.4}
.cal button.trained{background:var(--red);color:#fff}
.cal button.today{outline:2px solid var(--ink)}
.cal button i{position:absolute;bottom:4px;width:5px;height:5px;border-radius:50%;background:var(--blue)}
.bars{display:flex;align-items:flex-end;gap:6px;height:120px}
.bars div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:100%;font-size:12px;color:var(--muted)}
.bars span{display:block;width:100%;border-radius:6px 6px 3px 3px;background:var(--ink);min-height:2px}
.bars .cur span{background:var(--red)}
.chat{display:flex;flex-direction:column;gap:10px;margin:8px 0 12px}
.msg{padding:10px 14px;border-radius:16px;max-width:88%;white-space:pre-wrap;font-size:15px}
.msg.u{align-self:flex-end;background:var(--ink);color:var(--bg);border-bottom-right-radius:4px}
.msg.a{align-self:flex-start;background:var(--card);box-shadow:var(--shadow);border-bottom-left-radius:4px}
.msg.sys{align-self:center;font-size:13px;color:var(--muted);background:var(--card2)}
.scan-btns{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.scan-btns button{background:var(--card);box-shadow:var(--shadow);border-radius:16px;min-height:86px;display:grid;place-items:center;gap:4px;font-weight:600;font-size:14px;padding:10px 4px}
.scan-btns svg{width:28px;height:28px;color:var(--red)}
.ob{min-height:100vh;display:flex;flex-direction:column;max-width:560px;margin:0 auto;padding:0 16px calc(20px + var(--safe-b))}
.ob .prog{height:4px;background:var(--card2);border-radius:2px;margin:14px 0 18px}.ob .prog i{display:block;height:100%;background:var(--red);border-radius:2px;transition:width .3s}
.ob .body{flex:1}.ob .foot{display:flex;gap:10px;padding-top:16px;position:sticky;bottom:0;background:var(--bg);padding-bottom:8px}
.ob h1{font-size:40px;margin-bottom:8px}
.hint{font-size:14px;color:var(--muted);margin-top:6px}
.banner{font-size:14px;padding:10px 12px;border-radius:12px;background:color-mix(in srgb,var(--yellow) 18%,var(--card));margin-top:12px}
.ok-badge{display:inline-flex;align-items:center;gap:6px;color:var(--green);font-weight:600;font-size:14px}
ol.steps{margin:0;padding-left:20px}ol.steps li{margin:8px 0}
code.k{font-size:13px;background:var(--card2);padding:2px 6px;border-radius:6px;overflow-wrap:anywhere}
.scan-view{position:relative;border-radius:16px;overflow:hidden;background:#000;aspect-ratio:4/3}
.scan-view video{width:100%;height:100%;object-fit:cover;display:block}
.scan-view i{position:absolute;left:10%;right:10%;top:25%;bottom:25%;border:3px solid var(--red);border-radius:14px;box-shadow:0 0 0 999px rgba(0,0,0,.3)}
.spin{width:22px;height:22px;border:3px solid var(--line);border-top-color:var(--red);border-radius:50%;animation:rot .8s linear infinite;display:inline-block;vertical-align:middle}
@keyframes rot{to{transform:rotate(360deg)}}
.plate-in{animation:pop .6s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scaleY(.2);opacity:0}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:370px){h1{font-size:32px}.sets{grid-template-columns:24px minmax(0,1fr) 68px 56px 44px}.stat .num{font-size:26px}}
</style>

<script>/* Exercise library, slot priorities, split templates and food database. */
(function (G) {
  // eq tags: barbell, dumbbell, machine (machines, cables, smith, cardio), pullup (pull-up bar / dip station). [] = no equipment.
  // k: 'c' compound, 'i' isolation. t: 'w' weighted (default), 'bw' bodyweight reps, 'time' seconds.
  // s: skill 1-3. r: rep override. inc: kg step. m: muscles (first = primary).
  const EX = {};
  function X(id, n, m, eq, k, inc, o) {
    o = o || {};
    EX[id] = { id, n, m, eq, k, inc, t: o.t || 'w', s: o.s || 1, r: o.r || null, h: o.h || null, c: o.c || [] };
  }
  // Squat / knee dominant
  X('bb_squat', 'Barbell back squat', ['quads', 'glutes'], ['barbell'], 'c', 5, { s: 2, c: ['Bar on upper back, brace your core hard', 'Sit down between your heels, knees track over toes', 'Drive up through the whole foot'] });
  X('hack_squat', 'Hack squat', ['quads', 'glutes'], ['machine'], 'c', 5, { c: ['Feet shoulder-width, mid-platform', 'Lower until thighs are at least parallel', 'Keep your back flat on the pad'] });
  X('leg_press', 'Leg press', ['quads', 'glutes'], ['machine'], 'c', 5, { c: ['Lower until knees reach ~90 degrees or deeper', 'Keep your lower back on the pad', "Don't lock knees out hard at the top"] });
  X('goblet_squat', 'Goblet squat', ['quads', 'glutes'], ['dumbbell'], 'c', 2, { c: ['Hold one dumbbell against your chest', 'Elbows inside the knees at the bottom', 'Chest up, push the floor away'] });
  X('front_squat', 'Front squat', ['quads', 'glutes'], ['barbell'], 'c', 2.5, { s: 3, c: ['Bar on front delts, elbows high', 'Upright torso, sit straight down', 'Brace before every rep'] });
  X('smith_squat', 'Smith machine squat', ['quads', 'glutes'], ['machine'], 'c', 5, { c: ['Feet slightly in front of the bar', 'Control the descent for 2 seconds', 'Full range you can own'] });
  X('heel_goblet', 'Heels-elevated goblet squat', ['quads'], ['dumbbell'], 'i', 2, { r: [10, 15], c: ['Heels on a plate or wedge', 'Knees travel forward over toes', 'Slow and deep for the quads'] });
  X('bw_squat', 'Bodyweight squat', ['quads', 'glutes'], [], 'c', 0, { t: 'bw', r: [15, 25], h: 'bw_bulgarian', c: ['Arms forward for balance', 'Sit back and down, chest tall', 'Pause 1 s at the bottom'] });
  X('pistol', 'Pistol squat (to box)', ['quads', 'glutes'], [], 'c', 0, { t: 'bw', s: 3, r: [5, 10], c: ['Sit to a box or bench on one leg', 'Free leg forward, arms forward', 'Lower the box as you get stronger'] });
  // Hinge
  X('deadlift', 'Deadlift', ['hamstrings', 'glutes', 'back'], ['barbell'], 'c', 5, { s: 3, r: [4, 8], c: ['Bar over mid-foot, shins touch the bar', 'Flat back, pull slack out of the bar', 'Push the floor away, lock out with glutes'] });
  X('bb_rdl', 'Romanian deadlift', ['hamstrings', 'glutes'], ['barbell'], 'c', 5, { s: 2, c: ['Soft knees, push hips back', 'Bar slides down the thighs', 'Stop when you feel a strong hamstring stretch'] });

<script>/* Pure training / nutrition logic. No DOM. Testable in Node. */
(function (G) {
  const D = G.DATA;
  const EX = D.EX;

  // ---------- dates (local, YYYY-MM-DD) ----------
  const pad = n => String(n).padStart(2, '0');
  const iso = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d, 12); };
  const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return iso(d); };
  const dow = s => (parse(s).getDay() + 6) % 7; // 0 = Monday
  const mondayOf = s => addDays(s, -dow(s));
  const daysBetween = (a, b) => Math.round((parse(b) - parse(a)) / 864e5);
  const todayISO = () => iso(new Date());

  // ---------- equipment & exercise picking ----------
  function equipSet(p) {
    const s = new Set();
    ['barbell', 'dumbbell', 'machine', 'pullup'].forEach(k => { if (p.equip && p.equip[k]) s.add(k); });
    return s;
  }
  const avail = (ex, eq) => ex.eq.every(t => eq.has(t));

  function slotOptions(slot, eq, exp) {
    let ids = (D.SLOTS[slot] || []).filter(id => EX[id] && avail(EX[id], eq));
    if (exp === 'beginner') {
      const easy = ids.filter(id => EX[id].s < 3);
      if (easy.length) ids = easy;
      ids = ids.map((id, i) => [id, i]).sort((a, b) => EX[a[0]].s - EX[b[0]].s || a[1] - b[1]).map(a => a[0]);
    }
    return ids;
  }

  function pick(slot, variant, used, eq, exp, rotate) {
    const fresh = slotOptions(slot, eq, exp).filter(id => !used.has(id));
    if (!fresh.length) return null;
    let id = fresh[variant % fresh.length];
    if (rotate && EX[id].k === 'i') {
      const pool = fresh.slice(0, Math.max(2, variant + 1));
      id = pool[(variant + rotate) % pool.length];
    }
    return id;
  }

  // All exercises that can replace exId (share a slot), available with this equipment.
  function swapOptions(exId, profile) {
    const eq = equipSet(profile);
    const out = [];
    Object.values(D.SLOTS).forEach(list => {
      if (list.includes(exId)) list.forEach(id => { if (id !== exId && !out.includes(id) && avail(EX[id], eq)) out.push(id); });
    });
    return out;
  }

  // ---------- prescriptions ----------
  const GOALS = {
    muscle: { main: [6, 10], c: [8, 12], i: [10, 15], rest: [120, 90, 60], name: 'Build muscle' },
    fat: { main: [6, 10], c: [8, 12], i: [12, 15], rest: [90, 75, 45], name: 'Burn fat' },
    recomp: { main: [6, 10], c: [8, 12], i: [10, 15], rest: [105, 90, 60], name: 'Recomp' },
  };
  const SETS = { beginner: [3, 3, 2], intermediate: [4, 3, 3], advanced: [4, 4, 3] };

  function rx(ex, goal, exp, isMain) {
    const g = GOALS[goal] || GOALS.muscle;
    const tier = isMain ? 0 : ex.k === 'c' ? 1 : 2;
    const range = ex.r ? ex.r : [g.main, g.c, g.i][tier];
    return { sets: (SETS[exp] || SETS.intermediate)[tier], lo: range[0], hi: range[1], rest: g.rest[tier] };
  }

  function pickFinisher(eq) {
    if (eq.has('machine')) return D.FIN.bike;
    if (eq.has('dumbbell')) return D.FIN.swing;
    return D.FIN.circuit;
  }

  function buildDay(tk, profile, rotate) {
    const t = D.T[tk];
    const eq = equipSet(profile);
    const exp = profile.exp || 'intermediate';
    const goal = profile.goal || 'muscle';
    const budget = (profile.minutes || 60) * 60;
    const maxEx = { beginner: 6, intermediate: 7, advanced: 8 }[exp] || 7;
    const useFin = (goal === 'fat' || goal === 'recomp') && profile.finisher !== false;
    const fin = useFin ? pickFinisher(eq) : null;
    let time = 300 + (fin ? 600 : 0);
    const used = new Set();
    const items = [];
    let mains = 0;
    for (const s of t.s) {
      if (items.length >= maxEx) break;
      const [slot, v] = s.split(':');
      const id = pick(slot, Number(v || 0), used, eq, exp, rotate || 0);
      if (!id) continue;
      const ex = EX[id];
      const isMain = ex.k === 'c' && mains < 2 && items.length < 3;
      const r = rx(ex, goal, exp, isMain);
      const cost = r.sets * (35 + r.rest) + (isMain && mains === 0 ? 180 : 0);
      if (items.length >= 3 && time + cost > budget) break;
      if (isMain) mains++;
      time += cost;
      used.add(id);
      items.push({ ex: id, sets: r.sets, lo: r.lo, hi: r.hi, rest: r.rest, main: isMain, slot });
    }
    return { id: tk, name: t.n, focus: t.f, items, fin: fin ? fin.id : null };
  }

  const DEFAULT_DAYS = { 2: [0, 3], 3: [0, 2, 4], 4: [0, 1, 3, 4], 5: [0, 1, 2, 4, 5], 6: [0, 1, 2, 3, 4, 5] };

  function buildPlan(profile, today, keep) {
    let sched = (profile.weekdays || []).slice().sort((a, b) => a - b);
    if (sched.length < 2) sched = DEFAULT_DAYS[3];
    if (sched.length > 6) sched = sched.slice(0, 6);
    const split = D.SPLITS[sched.length];
    const days = split.d.map(tk => buildDay(tk, profile, 0));
    return {
      v: 1,
      created: today,
      start: keep && keep.start ? keep.start : mondayOf(today),
      split: split.n,
      goal: profile.goal,
      sched,
      days,
      block: keep && keep.block ? keep.block : 1,
      volAdj: keep && keep.volAdj ? keep.volAdj : 0,
    };
  }

  // On a new 6-week block, rotate accessory exercises the user hasn't customised.
  function refreshBlock(plan, profile, today) {
    const wi = weekInfo(plan, today);
    if (wi.block <= (plan.block || 1)) return null;
    const rot = wi.block - 1;
    const changed = [];
    plan.days.forEach(day => {
      const fresh = buildDay(day.id, profile, rot);
      day.items = day.items.map(it => {
        if (it.custom) return it;
        const f = fresh.items.find(x => x.slot === it.slot);
        if (f && f.ex !== it.ex && EX[it.ex].k === 'i') { changed.push(EX[f.ex].n); return Object.assign({}, it, { ex: f.ex, lo: f.lo, hi: f.hi }); }
        return it;
      });
    });
    plan.block = wi.block;
    return changed;
  }

  // ---------- periodisation ----------
  function weekInfo(plan, today) {
    const w = Math.max(0, Math.floor(daysBetween(plan.start, today) / 7));
    const week = (w % 6) + 1;
    const block = Math.floor(w / 6) + 1;
    const deload = week === 6;
    const rir = [3, 2, 2, 1, 1, 4][week - 1];
    return {
      week, block, deload, rir,
      label: deload ? 'Deload week' : 'Week ' + week + ' of 6',
      tip: deload ? 'Same weights, half the sets. Leave 3–4 reps in the tank and recover.'
        : 'Stop each set with about ' + rir + ' rep' + (rir > 1 ? 's' : '') + ' left in the tank.',
    };
  }

  function effSets(item, wi, volAdj) {
    let s = item.sets;
    if (volAdj && (EX[item.ex].k === 'i' || !item.main)) s = Math.min(5, Math.max(2, s + volAdj));
    if (wi && wi.deload) s = Math.max(1, Math.ceil(s / 2));
    return s;
  }

  function estMinutes(day, profile, wi, volAdj) {
    let t = 300 + (day.fin ? 600 : 0);
    day.items.forEach((it, i) => { t += effSets(it, wi, volAdj) * (35 + it.rest) + (i === 0 && it.main ? 180 : 0); });
    return Math.round(t / 60 / 5) * 5;
  }

  // ---------- history & progression ----------
  const doneSets = it => (it.sets || []).filter(s => s.done && Number(s.reps) > 0);

  function history(sessions, exId, beforeId) {
    const out = [];
    for (let i = sessions.length - 1; i >= 0; i--) {
      const s = sessions[i];
      if (beforeId && s.id === beforeId) continue;
      const it = (s.items || []).find(x => x.ex === exId);
      if (it) { const ds = doneSets(it); if (ds.length) out.push({ d: s.d, sets: ds, all: it.sets }); }
    }
    return out; // most recent first
  }

  const roundTo = (x, inc) => inc ? Math.round(x / inc) * inc : Math.round(x);
  const r2 = x => Math.round(x * 100) / 100;

  function suggest(item, sessions, wi, beforeId) {
    const ex = EX[item.ex];
    const lo = item.lo, hi = item.hi;
    const h = history(sessions, item.ex, beforeId);
    if (!h.length) {
      return {
        kg: null, reps: ex.t === 'time' ? lo : hi, prev: [],
        note: ex.t === 'w' ? 'First time: pick a weight you could lift about ' + (hi + 2) + ' times, then stop at ' + hi + '.'
          : ex.t === 'time' ? 'Hold for ' + lo + '–' + hi + ' seconds with perfect form.'
            : 'Aim for ' + lo + '–' + hi + ' clean reps.',
      };
    }
    const last = h[0];
    const sets = last.sets;
    const kgs = sets.map(s => Number(s.kg) || 0);
    const top = Math.max.apply(null, kgs);
    const atTop = sets.filter(s => (Number(s.kg) || 0) === top);
    const maxReps = Math.max.apply(null, sets.map(s => Number(s.reps)));
    const minTop = Math.min.apply(null, atTop.map(s => Number(s.reps)));

  push(key, b) {

      const code = e && e.code;

}
async function initCloud() {
  const C = window.claude;
  if (!C || typeof C.use !== 'function') { UI.cloud = 'local'; return; }
  let db = null, user = null;
  try { [db, user] = await Promise.all([C.use('db'), C.use('user')]); } catch (e) { }
  let id = null;
  if (db && user) { try { id = await user.id(); } catch (e) { } }
  if (!id) { UI.cloud = 'local'; softRender(); return; }
  Store.db = db; Store.uid = id; Store.mode = 'cloud'; UI.cloud = 'syncing'; softRender();
  const slow = setTimeout(() => { if (UI.cloud === 'syncing') { UI.cloud = 'slow'; softRender(); } }, 10000);
  try {
    const snap = await db.collection('data/users/' + id).get();
    clearTimeout(slow);
    const remote = new Set();
    let changed = false;
    snap.docs.forEach(doc => {
      if (!doc.exists) return;
      const b = JSON.parse(JSON.stringify(doc.data()));
      remote.add(doc.id);
      const localAt = Store.saved[doc.id] || 0;
      if ((b.savedAt || 0) > localAt) { Store.apply(doc.id, b); Store.saved[doc.id] = b.savedAt; Store.ls(doc.id, b); changed = true; }
      else if (localAt > (b.savedAt || 0)) Store.dirty.add(doc.id);
    });
    const idx = new Set(Store.ls('index') || []);
    idx.forEach(k => { if (!remote.has(k)) Store.dirty.add(k); });
    remote.forEach(k => idx.add(k));
    Store.ls('index', Array.from(idx));
    UI.cloud = 'ok';
    if (Store.dirty.size) Store.flush();
    if (changed) { if (S.active) UI.wkOpen = UI.wkOpen || false; render(); } else softRender();
  } catch (e) {
    clearTimeout(slow); UI.cloud = 'local'; Store.mode = 'local'; softRender();
  }
}

    '<rect x="88" y="' + (cy - 3.5) + '" width="164" height="7" rx="3" fill="url(#stl)"/><rect x="120" y="' + (cy - 3.5) + '" width="100" height="7" fill="url(#knurl)" opacity=".8"/>' +
    '<rect x="80" y="' + (cy - 13) + '" width="9" height="26" rx="2" fill="#80868e"/><rect x="251" y="' + (cy - 13) + '" width="9" height="26" rx="2" fill="#80868e"/>';
  const w = 11, gap = 2;
  for (let i = 0; i < target; i++) {
    const c = PLATES[i % 6][0], h = PLATES[i % 6][1];
    const xl = 79 - (i + 1) * (w + gap) + gap, xr = 261 + i * (w + gap);
    const y = cy - h / 2;
    [xl, xr].forEach(x => {
      if (i < done) {
        const cls = i === fresh ? ' class="plate-in" style="transform-box:fill-box;transform-origin:center"' : '';
        s += '<g' + cls + '><rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" rx="3" fill="' + c + '"/><rect x="' + (x + 1.5) + '" y="' + (y + 4) + '" width="2" height="' + (h - 8) + '" rx="1" fill="#fff" opacity=".35"/><rect x="' + (x + w - 3) + '" y="' + (y + 3) + '" width="2" height="' + (h - 6) + '" rx="1" fill="#000" opacity=".22"/></g>';

      }
    });
  }
  return s + '</svg>';
}

// --- images ---
function loadImage(file) {
  return new Promise((res, rej) => { const url = URL.createObjectURL(file); const img = new Image(); img.onload = () => res({ img, url }); img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('image')); }; img.src = url; });
}
async function downscale(file, max, q) {
  const { img, url } = await loadImage(file);
  const sc = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
  const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * sc); c.height = Math.round(img.naturalHeight * sc);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  URL.revokeObjectURL(url);
  const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', q || .85));
  return { blob, dataUrl: c.toDataURL('image/jpeg', .6) };
}
// --- barcode ---
let zxingP = null;
function loadZXing() {
  if (window.ZXing) return Promise.resolve();
  if (!zxingP) zxingP = new Promise((res, rej) => { const s = document.createElement('script'); s.src = 'zxing.min.js'; s.onload = res; s.onerror = () => { zxingP = null; rej(new Error('zxing')); }; document.head.appendChild(s); });
  return zxingP;
}
async function decodeBarcode(file) {
  await loadZXing();
  const Z = window.ZXing;
  const { img, url } = await loadImage(file);
  const hints = new Map();
  hints.set(Z.DecodeHintType.TRY_HARDER, true);
  hints.set(Z.DecodeHintType.POSSIBLE_FORMATS, [Z.BarcodeFormat.EAN_13, Z.BarcodeFormat.EAN_8, Z.BarcodeFormat.UPC_A, Z.BarcodeFormat.UPC_E, Z.BarcodeFormat.QR_CODE, Z.BarcodeFormat.CODE_128, Z.BarcodeFormat.DATA_MATRIX]);
  const reader = new Z.MultiFormatReader(); reader.setHints(hints);
  const c = document.createElement('canvas'), ctx = c.getContext('2d', { willReadFrequently: true });
  const W = img.naturalWidth, H = img.naturalHeight;
  try {
    for (const max of [1000, 1600, 640, 2200]) {
      const sc = Math.min(1, max / Math.max(W, H));
      for (const rot of [0, 90]) {
        const w = Math.round(W * sc), h = Math.round(H * sc);
        c.width = rot ? h : w; c.height = rot ? w : h;
        ctx.save(); if (rot) { ctx.translate(h, 0); ctx.rotate(Math.PI / 2); } ctx.drawImage(img, 0, 0, w, h); ctx.restore();
        for (const Bin of [Z.HybridBinarizer, Z.GlobalHistogramBinarizer]) {
          try { const src = new Z.HTMLCanvasElementLuminanceSource(c); return reader.decode(new Z.BinaryBitmap(new Bin(src))).getText(); } catch (e) { }
        }
      }
    }
  } finally { URL.revokeObjectURL(url); }
  return null;
}

async function lookupCode(raw) {

async function offLookup(code) {
  const ctl = typeof AbortController !== 'undefined' ? new AbortController() : null;
  const timer = setTimeout(() => { if (ctl) ctl.abort(); }, 8000);
  try {
    const r = await fetch('https://world.openfoodfacts.org/api/v2/product/' + encodeURIComponent(code) + '.json?fields=code,product_name,product_name_nl,product_name_en,generic_name,brands,nutriments,serving_quantity', ctl ? { signal: ctl.signal } : {});
    if (!r.ok) return null;
    const j = await r.json();
    if (j.status !== 1 || !j.product) return null;
    const p = j.product, nu = p.nutriments || {};
    const n = v => { const x = Number(v); return isFinite(x) && x >= 0 ? x : null; };
    let kcal = n(nu['energy-kcal_100g']);
    if (kcal == null && n(nu.energy_100g) != null) kcal = n(nu.energy_100g) / 4.184;
    const name = String(p.product_name_nl || p.product_name || p.product_name_en || p.generic_name || ('Product ' + code)).trim().slice(0, 80);
    const brand = String(p.brands || '').split(',')[0].trim().slice(0, 40);
    if (kcal == null) return { partial: true, n: name, brand };
    const out = { n: name, brand, kcal: Math.round(kcal), p: r1(n(nu.proteins_100g) || 0), c: r1(n(nu.carbohydrates_100g) || 0), f: r1(n(nu.fat_100g) || 0), via: 'off' };
    const sq = n(p.serving_quantity);
    if (sq > 0 && sq < 2000) { out.u = 'portion'; out.ug = r1(sq); }
    return out;
  } catch (e) { return null; } finally { clearTimeout(timer); }
}

let SCAN = null;
async function liveScanner() {
  sheet(sheetHead('Scan barcode', 'Hold the barcode inside the frame') + '<div class="scan-view"><video id="scan-v" playsinline muted autoplay></video><i></i></div><p class="small muted mt" id="scan-msg">Starting camera…</p>' +
    '<div class="grid2 mt"><button class="btn" data-a="scan-photo">' + I.camera.replace('<svg', '<svg style="width:18px;height:18px"') + ' Photo instead</button><button class="btn" data-a="scan-type">Type number</button></div>');
  const v = $('#scan-v'), msg = $('#scan-msg');
  const me = SCAN = { stream: null, timer: null, busy: false };
  try {
    await loadZXing();
    me.stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false });
  } catch (e) { if (SCAN === me && msg) msg.textContent = 'Camera not available. Allow camera access for this site in Settings, or take a photo instead.'; return; }
  if (SCAN !== me || !document.body.contains(v)) { me.stream.getTracks().forEach(t => t.stop()); return; }
  v.srcObject = me.stream;
  try { await v.play(); } catch (e) { }
  if (msg) msg.textContent = 'Looking for a barcode…';
  const Z = window.ZXing, reader = new Z.MultiFormatReader(), hints = new Map();
  hints.set(Z.DecodeHintType.POSSIBLE_FORMATS, [Z.BarcodeFormat.EAN_13, Z.BarcodeFormat.EAN_8, Z.BarcodeFormat.UPC_A, Z.BarcodeFormat.UPC_E, Z.BarcodeFormat.QR_CODE, Z.BarcodeFormat.CODE_128]);
  reader.setHints(hints);
  const c = document.createElement('canvas'), ctx = c.getContext('2d', { willReadFrequently: true });
  let k = 0;
  me.timer = setInterval(() => {
    if (me.busy || SCAN !== me || !v.videoWidth) return;
    me.busy = true;
    try {
      const W = v.videoWidth, H = v.videoHeight, crop = (k++ % 2) === 1;
      const sx = crop ? W * .1 : 0, sy = crop ? H * .25 : 0, sw = crop ? W * .8 : W, sh = crop ? H * .5 : H;
      const sc = Math.min(1, 960 / sw);
      c.width = Math.round(sw * sc); c.height = Math.round(sh * sc);
      ctx.drawImage(v, sx, sy, sw, sh, 0, 0, c.width, c.height);
      const text = reader.decode(new Z.BinaryBitmap(new Z.HybridBinarizer(new Z.HTMLCanvasElementLuminanceSource(c)))).getText();
      if (text) { stopScanner(); try { if (navigator.vibrate) navigator.vibrate(60); } catch (e) { } closeAll(); lookupCode(text); }
    } catch (e) { } finally { me.busy = false; }
  }, 160);
}

function lineChart(el, pts, o) {
  const W = el.clientWidth, H = el.clientHeight;
  if (!W || !H) return;
  if (pts.length < 2) { el.innerHTML = '<svg viewBox="0 0 ' + W + ' ' + H + '"><text x="' + W / 2 + '" y="' + H / 2 + '" text-anchor="middle" fill="currentColor" opacity=".55" font-size="14">Log at least 2 entries to see a trend</text></svg>'; return; }
  const pad = { l: 40, r: 10, t: 12, b: 24 };
  const xs = pts.map(p => E.parse(p.d).getTime()), ys = pts.map(p => p.v);
  let lo = Math.min(...ys), hi = Math.max(...ys);
  if (o.goal && o.goal > 0) { lo = Math.min(lo, o.goal); hi = Math.max(hi, o.goal); }
  const sp = (hi - lo) || 1; lo -= sp * .15; hi += sp * .15;
  const x0 = xs[0], x1 = xs[xs.length - 1] === x0 ? x0 + 864e5 : xs[xs.length - 1];
  const X = t => pad.l + (W - pad.l - pad.r) * (t - x0) / (x1 - x0), Y = v => pad.t + (H - pad.t - pad.b) * (1 - (v - lo) / (hi - lo));
  let s = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Chart from ' + pts[0].v + ' to ' + pts[pts.length - 1].v + ' ' + o.unit + '">';
  for (let i = 0; i <= 3; i++) { const v = lo + (hi - lo) * i / 3, y = Y(v); s += '<line x1="' + pad.l + '" x2="' + (W - pad.r) + '" y1="' + y + '" y2="' + y + '" stroke="currentColor" opacity=".08"/><text x="' + (pad.l - 6) + '" y="' + (y + 4) + '" text-anchor="end" font-size="11" fill="currentColor" opacity=".55">' + r1(v) + '</text>'; }
  if (o.goal) { const y = Y(o.goal); s += '<line x1="' + pad.l + '" x2="' + (W - pad.r) + '" y1="' + y + '" y2="' + y + '" stroke="currentColor" stroke-dasharray="4 4" opacity=".4"/><text x="' + (W - pad.r) + '" y="' + (y - 5) + '" text-anchor="end" font-size="11" fill="currentColor" opacity=".6">goal</text>'; }
  const path = pts.map((p, i) => (i ? 'L' : 'M') + X(xs[i]).toFixed(1) + ' ' + Y(p.v).toFixed(1)).join(' ');
  if (o.avg && pts.length >= 4) {
    const av = pts.map((p, i) => { const win = pts.filter((q, j) => j <= i && xs[i] - xs[j] < 7 * 864e5); return win.reduce((a, q) => a + q.v, 0) / win.length; });
    s += '<path d="' + av.map((v, i) => (i ? 'L' : 'M') + X(xs[i]).toFixed(1) + ' ' + Y(v).toFixed(1)).join(' ') + '" fill="none" stroke="' + o.color + '" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>';
    s += '<path d="' + path + '" fill="none" stroke="' + o.color + '" stroke-width="1" opacity=".35"/>';
  } else s += '<path d="' + path + '" fill="none" stroke="' + o.color + '" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>';
  pts.forEach((p, i) => { s += '<circle cx="' + X(xs[i]) + '" cy="' + Y(p.v) + '" r="' + (pts.length > 30 ? 1.8 : 3) + '" fill="' + o.color + '"/>'; });
  s += '<text x="' + pad.l + '" y="' + (H - 6) + '" font-size="11" fill="currentColor" opacity=".55">' + dm(pts[0].d) + '</text><text x="' + (W - pad.r) + '" y="' + (H - 6) + '" text-anchor="end" font-size="11" fill="currentColor" opacity=".55">' + dm(pts[pts.length - 1].d) + '</text>';
  el.innerHTML = s + '</svg>';
}

function importHealth(map, src) {
  const days = Object.keys(map);
  if (!days.length) { toast('Nothing recognised. Check the text format.'); return false; }
  days.forEach(d => {
    const rec = map[d];
    const w = rec.weight; delete rec.weight;
    if (Object.keys(rec).length) S.activity[d] = Object.assign({}, S.activity[d] || {}, rec, { at: Date.now(), src });
    if (w && !S.weights.some(x => x.d === d)) upsertWeight(d, w);
  });
  const cut = E.addDays(today(), -180);
  Object.keys(S.activity).forEach(d => { if (d < cut) delete S.activity[d]; });
  Store.mark('profile');
  const r = map[days[days.length - 1]] || S.activity[days[days.length - 1]] || {};
  const a = S.activity[days[days.length - 1]] || {};
  toast('Imported ' + days.length + ' day' + (days.length > 1 ? 's' : '') + (a.steps != null ? ': ' + fmt(a.steps) + ' steps' : '') + (r && a.active != null ? ', ' + fmt(a.active) + ' kcal' : ''));
  return true;
}

const coachMsg = m => '<div class="msg ' + (m.role === 'user' ? 'u' : m.role === 'sys' ? 'sys' : 'a') + '">' + esc(m.content) + '</div>';
async function coachSend(text) {

  UI.coachBusy = true;
  UI.coach.push({ role: 'user', content: text });
  const chat = $('#chat');
  const redraw = () => { if (chat) { chat.innerHTML = UI.coach.map(coachMsg).join(''); chat.scrollTop = chat.scrollHeight; } };
  UI.coach.push({ role: 'assistant', content: '…' }); redraw();
  const hist = UI.coach.filter(m => m.role !== 'sys').slice(0, -1).slice(-10);
  const msgs = hist.map((m, i) => ({ role: m.role, content: i === 0 ? COACH_SYS + coachContext() + '\n\nUser: ' + m.content : m.content }));
  if (msgs[0].role !== 'user') msgs.shift();
  const changes = [];
  const tools = [
    { name: 'swap_exercise', description: 'Replace one exercise in a plan day with another AVAILABLE exercise id.', inputSchema: { type: 'object', properties: { day: { type: 'integer', description: 'plan day index' }, from: { type: 'string', description: 'current exercise id' }, to: { type: 'string', description: 'new exercise id from the AVAILABLE list' } }, required: ['day', 'from', 'to'] },
      execute: inp => {
        const d = S.plan.days[inp.day]; if (!d) throw new Error('No such day');
        const it = d.items.find(x => x.ex === inp.from); if (!it) throw new Error('Exercise ' + inp.from + ' is not in ' + d.name);
        const nx = EX[inp.to]; if (!nx || !E.avail(nx, E.equipSet(S.profile))) throw new Error('Exercise not available with the user’s equipment');
        if (d.items.some(x => x.ex === inp.to)) throw new Error('Already in that day');
        const r = E.rx(nx, S.profile.goal, S.profile.exp, it.main);
        Object.assign(it, { ex: inp.to, lo: r.lo, hi: r.hi, rest: r.rest, custom: true });
        Store.mark('profile'); changes.push('Swapped ' + EX[inp.from].n + ' → ' + nx.n + ' on ' + d.name);
        return 'Done: ' + EX[inp.from].n + ' replaced by ' + nx.n + ' on ' + d.name + '.';
      } },
    { name: 'set_goal', description: 'Switch the training goal. Use only when the user explicitly asks.', inputSchema: { type: 'object', properties: { goal: { type: 'string', enum: ['fat', 'muscle', 'recomp'] } }, required: ['goal'] },
      execute: inp => { if (!GOAL_NAMES[inp.goal]) throw new Error('bad goal'); applyGoal(inp.goal); changes.push('Goal set to ' + GOAL_NAMES[inp.goal]); return 'Goal switched to ' + GOAL_NAMES[inp.goal] + '.'; } },
  ];
  const last = UI.coach[UI.coach.length - 1];
  try {
    const res = await SAMPLE(msgs, { cache: false, tools, onText: ({ text }) => { last.content = text || '…'; const el = chat && chat.lastElementChild; if (el) { el.textContent = last.content; chat.scrollTop = chat.scrollHeight; } } });

  } catch (e) {
    last.content = claudeError(e);
  }
  changes.forEach(c => UI.coach.push({ role: 'sys', content: c }));
  UI.coachBusy = false; redraw();
  if (changes.length) UI.needRender = true;
}

  'food-cat': el => { const q = $('#food-q'); if (q) q.value = el.dataset.v; const r = $('#food-results'); if (r) r.innerHTML = foodResults(el.dataset.v); $$('[data-a="food-cat"]').forEach(b => { b.style.background = b === el ? 'var(--ink)' : ''; b.style.color = b === el ? 'var(--bg)' : ''; }); },
  'food-pick': el => { const f = foodFrom(el.dataset.src, el.dataset.v); if (f) amountSheet(f); },
  'amt-meal': el => { UI.amt.meal = el.dataset.v; $$('[data-a="amt-meal"]').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === UI.amt.meal)); },
  'amt-save': () => saveAmount(),
  'entry-edit': el => editEntry(el.dataset.v),
  'entry-del': () => { const d = UI.foodDate || today(); S.food[d] = (S.food[d] || []).filter(x => x.id !== UI.amt.edit.id); Store.markDate('f', d); closeAll(); render(); toast('Removed'); },
  'food-copy': () => { const d = UI.foodDate || today(), y = E.addDays(d, -1); (S.food[y] || []).forEach(e => addEntry(d, Object.assign({}, e, { id: undefined }))); (S.food[d] || []).forEach(e => { if (!e.id) e.id = newId(); }); render(); toast('Copied'); },
  'quick-add': () => { UI.qaSave = false; if (!$('#sheets .scrim')) sheet(''); quickAddSheet(); },
  'qa-meal': el => { UI.meal = el.dataset.v; $$('[data-a="qa-meal"]').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === UI.meal)); },
  'qa-save-toggle': el => { UI.qaSave = !UI.qaSave; el.setAttribute('aria-checked', UI.qaSave); },
  'qa-add': () => quickAdd(),
  'scan-barcode': () => { if (STANDALONE && navigator.mediaDevices && navigator.mediaDevices.getUserMedia) { stopScanner(); liveScanner(); return; } const f = $('#file-barcode'); f.value = ''; f.click(); },
  'scan-photo': () => { stopScanner(); closeAll(); const f = $('#file-barcode'); f.value = ''; f.click(); },
  'scan-type': () => { stopScanner(); closeAll(); manualCodeSheet('Type barcode'); },
  'food-quick': () => { UI.meal = guessMeal(); UI.qaSave = false; sheet(''); quickAddSheet(); },
  'meal-photo': () => { if (!(SAMPLE && SAMPLE_IMG)) { toast('Meal recognition works when Repwise is opened from claude.ai'); return; } const f = $('#file-photo'); f.value = ''; f.click(); },
  'label-photo': () => { const f = $('#file-label'); f.value = ''; f.click(); },
  'bc-lookup': () => { const v = ($('#bc-manual').value || '').replace(/\D/g, ''); if (v.length < 8) { toast('Type the 8 or 13 digits'); return; } closeAll(); lookupCode(v); },
  'product-manual': () => productForm({}, UI.labelFor),
  'product-save': () => saveProduct(),
  'meal-analyse': () => analyseMeal(),
  'mi-del': el => { UI.mealItems.splice(Number(el.dataset.v), 1); mealReview(); },
  'mr-meal': el => { UI.meal = el.dataset.v; $$('[data-a="mr-meal"]').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === UI.meal)); },
  'meal-add': () => addMealItems(),
  'prod-del': el => { delete S.products[el.dataset.v]; S.recents = S.recents.filter(r => !(r.src === 'product' && r.id === el.dataset.v)); Store.mark('profile'); softRender(); },
  // me
  'profile-edit': () => profileSheet(),
  'pe-sex': el => { UI.peSex = el.dataset.v; $('#pe-sex').innerHTML = seg('pe-sex', UI.peSex, [['m', 'Male'], ['f', 'Female']]); },
  'profile-save': () => {
    const p = S.profile, age = Number($('#pe-age').value), h = Number($('#pe-h').value), t = toNum($('#pe-t').value);
    if (!(age >= 14 && age <= 99 && h >= 120 && h <= 230)) { toast('Check age and height'); return; }
    Object.assign(p, { name: $('#pe-name').value.trim(), sex: UI.peSex, age, height: h, target: t > 30 ? t : null, activity: $('#pe-act').value });
    Store.mark('profile'); closeAll(); render(); toast('Profile saved');
  },
  'tr-day': el => { const w = trState().weekdays, v = Number(el.dataset.v), i = w.indexOf(v); if (i >= 0) w.splice(i, 1); else if (w.length < 6) w.push(v); softRender(); },
  'tr-min': el => { trState().minutes = Number(el.dataset.v); softRender(); },
  'tr-exp': el => { trState().exp = el.dataset.v; softRender(); },
  'tr-preset': el => { trState().equip = Object.assign({}, EQ_PRESETS[el.dataset.v][1]); softRender(); },
  'tr-eq': el => { const e = trState().equip; e[el.dataset.v] = !e[el.dataset.v]; softRender(); },
  'tr-fin': () => { const t = trState(); t.finisher = !t.finisher; softRender(); },
  'tr-save': () => {
    const t = UI.tr, p = S.profile;
    Object.assign(p, { weekdays: t.weekdays.slice().sort((a, b) => a - b), minutes: t.minutes, exp: t.exp, equip: Object.assign({}, t.equip), finisher: t.finisher });
    S.plan = E.buildPlan(p, today(), S.plan); UI.tr = null; Store.mark('profile'); render(); toast('New plan built: ' + S.plan.split);
  },
  'nu-watch': el => { S.nutrition.useActivity = !S.nutrition.useActivity; el.setAttribute('aria-checked', !!S.nutrition.useActivity); Store.mark('profile'); UI.needRender = true; if (!$('#sheets .scrim')) softRender(); if (S.nutrition.useActivity && !S.activity[today()]) toast('Import today’s Apple Health data to use it'); },
  'nu-manual': () => { const v = Math.round(toNum($('#nu-manual').value)); if (!(v >= 1200 && v <= 6000)) { toast('Enter a target between 1,200 and 6,000 kcal'); return; } S.nutrition.manual = v; Store.mark('profile'); softRender(); toast('Target set to ' + fmt(v) + ' kcal'); },
  'nu-reset': () => { delete S.nutrition.manual; S.nutrition.adjust = 0; Store.mark('profile'); softRender(); },
  backup: async () => {
    const data = JSON.stringify(Object.assign({ app: 'repwise', v: 1, exported: new Date().toISOString() }, JSON.parse(JSON.stringify(S))));
    try { await navigator.clipboard.writeText(data); toast('Backup copied. Paste it into Notes or a message to yourself.', 3500); }
    catch (e) { sheet(sheetHead('Your backup', 'Select all and copy') + '<textarea readonly style="min-height:200px;font-size:12px">' + esc(data) + '</textarea>'); }
  },
  restore: () => sheet(sheetHead('Restore backup', 'This replaces all current data') + '<textarea id="restore-in" placeholder="Paste your backup here"></textarea><button class="btn primary block mt" data-a="restore-do">Restore</button>'),
  'restore-do': () => {
    let b; try { b = JSON.parse($('#restore-in').value); } catch (e) { toast('That is not a valid backup'); return; }
    if (!b || !b.profile || !b.plan) { toast('That is not a Repwise backup'); return; }
    Object.keys(S).forEach(k => { if (b[k] !== undefined) S[k] = b[k]; });
    sortSessions(); allKeys().forEach(k => Store.dirty.add(k)); Store.flush(); closeAll(); render(); toast('Backup restored');
  },
  reset: () => sheet(sheetHead('Erase everything?') + '<p>This deletes your profile, plan, workouts and food log on this device and in your Claude account. Consider copying a backup first.</p><div class="grid2 mt2"><button class="btn" data-a="close">Cancel</button><button class="btn" style="color:var(--red)" data-a="reset-do">Erase</button></div>'),
  'reset-do': async () => {
    const keys = new Set(allKeys().concat(Store.ls('index') || []));
    for (const k of keys) await Store.remove(k);
    Store.ls('index', null);
    Object.assign(S, { profile: null, plan: null, nutrition: { adjust: 0 }, weights: [], checkins: [], activity: {}, products: {}, customFoods: [], recents: [], active: null, settings: {}, sessions: [], food: {} });
    UI.ob = null; UI.tab = 'today'; closeAll(); render(); toast('All data erased');
  },
  // health
  health: () => healthSheet(),
  'health-guide': () => healthGuide(),
  'health-import': () => { const t = $('#h-paste').value; if (importHealth(E.parseHealth(t, today()), 'shortcut')) { closeAll(); render(); } },
  'health-manual': () => {
    const rec = {}; const st = toNum($('#h-st').value), ac = toNum($('#h-ac').value), ex = toNum($('#h-ex').value);
    if (st >= 0) rec.steps = Math.round(st); if (ac >= 0) rec.active = Math.round(ac); if (ex >= 0) rec.exercise = Math.round(ex);
    if (!Object.keys(rec).length) { toast('Enter at least one number'); return; }
    if (importHealth({ [today()]: rec }, 'manual')) { closeAll(); render(); }
  },
  // coach
  coach: () => coachSheet(),
  'coach-q': el => { const i = $('#coach-in'); if (i) i.value = el.dataset.v; coachSend(el.dataset.v).then(() => { const x = $('#coach-in'); if (x) x.value = ''; }); },
  'coach-send': () => { const i = $('#coach-in'); const v = i.value; i.value = ''; coachSend(v); },
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]');
  if (!el || el.disabled) return;
  const fn = A[el.dataset.a];
  if (fn) { e.preventDefault(); fn(el, e); }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.ob !== undefined) { UI.ob.p[t.dataset.ob] = t.value; const btn = $('[data-a="ob-next"]'); if (btn) btn.disabled = !obValid(); return; }
  if (t.dataset.si !== undefined) { const st = S.active.items[Number(t.dataset.si)].sets[Number(t.dataset.sj)]; st[t.dataset.f] = t.value.trim(); Store.mark('profile'); return; }
  if (t.dataset.amt !== undefined) { if (t.dataset.amt === 'unit') { UI.amt.unit = t.value; const u = UI.amt.units.find(x => x[0] === t.value); const inp = $('#amt'); if (inp) { inp.value = u && u[0] === 'g' ? 100 : 1; UI.amt.amount = inp.value; } } else UI.amt.amount = t.value; const o = $('#amt-out'); if (o) o.innerHTML = amtOut(); return; }
  if (t.dataset.ci !== undefined) { UI.ci[t.dataset.ci] = t.value; return; }
  if (t.dataset.mi !== undefined) { const it = UI.mealItems[Number(t.dataset.mi)]; const g = toNum(t.value); if (g > 0) { it.g = g; } clearTimeout(UI.miT); UI.miT = setTimeout(() => { const pos = t.selectionStart; mealReview(); const n = $('input[data-mi="' + t.dataset.mi + '"]'); if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (x) { } } }, 600); return; }
  if (t.dataset.filter === 'food') { const r = $('#food-results'); if (r) r.innerHTML = foodResults(t.value); return; }
  if (t.dataset.filter === 'ex') { const q = t.value.trim().toLowerCase(); $$('#ex-pick [data-s]').forEach(b => { b.style.display = !q || q.split(/\s+/).every(w => b.dataset.s.includes(w)) ? '' : 'none'; }); return; }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.aChange === 'prog-ex') { UI.progEx = t.value; softRender(); }
  if (t.id === 'file-barcode') onBarcodeFile(t.files && t.files[0]);
  if (t.id === 'file-label') onLabelFile(t.files && t.files[0]);
  if (t.id === 'file-photo') onPhotoFile(t.files && t.files[0]);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id === 'coach-in') { e.preventDefault(); A['coach-send'](); }
  if (e.key === 'Enter' && e.target.dataset && e.target.dataset.si !== undefined && e.target.dataset.f === 'kg') { e.preventDefault(); const n = $('input[data-si="' + e.target.dataset.si + '"][data-sj="' + e.target.dataset.sj + '"][data-f="reps"]'); if (n) n.focus(); }
  if (e.key === 'Escape') { closeSheet(); afterClose(); }
});
// sheet backdrop close hook
new MutationObserver(() => afterClose()).observe(document.getElementById('sheets'), { childList: true });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') Store.flush(); else { tickRest(); } });
window.addEventListener('pagehide', () => Store.flush());
window.addEventListener('hashchange', () => routeHash());
function routeHash() {
  const h = (location.hash || '').slice(1);
  if (['today', 'plan', 'food', 'progress', 'me'].includes(h)) { if (UI.tab !== h) { UI.tab = h; render(); } }
  else if (h === 'health' && S.profile) { healthSheet(); setTimeout(() => { const p = $('#h-paste'); if (p) p.focus(); }, 300); }
  else if (h === 'coach' && S.profile && SAMPLE) coachSheet();
  else if (h === 'scan' && S.profile) { UI.tab = 'food'; render(); }
}
setInterval(() => {
  if (S.active) $$('[data-elapsed]').forEach(x => { x.textContent = elapsed(); });
  tickRest();
}, 500);

// ---------- init ----------
loadLocal();
if (S.active && S.active.d !== today() && Date.now() - S.active.start > 12 * 3600e3) { /* stale workout from a previous day: keep it but don't auto-open */ }
render();
routeHash();
initCloud().then(() => initSample());
if (STANDALONE) {
  if ('serviceWorker' in navigator) window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => { }); });
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => { }); } catch (e) { }
}

})();</script>
</body>
